[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
allow_paths = ["../node_modules"]

remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Arc Testnet deployment profile (A1, dry-run only). Explicit standalone
# profile: repeats every key so the default (shanghai) profile is untouched.
# EVM target follows the official Arc baseline (Osaka). If the pinned solc
# does not accept "osaka", this profile is a documented blocker, not a reason
# to change the default profile or upgrade solc repo-wide.
[profile.arc]
src = "src"
out = "out-arc"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "osaka"
allow_paths = ["../node_modules"]

remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
