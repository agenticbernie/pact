[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
avalanche_fuji = "${AVALANCHE_FUJI_RPC_PRIMARY}"
avalanche_fuji_fallback = "${AVALANCHE_FUJI_RPC_FALLBACK}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_PRIMARY}"
arbitrum_sepolia_fallback = "${ARBITRUM_SEPOLIA_RPC_FALLBACK}"
base_sepolia = "${BASE_SEPOLIA_RPC_PRIMARY}"
base_sepolia_fallback = "${BASE_SEPOLIA_RPC_FALLBACK}"
