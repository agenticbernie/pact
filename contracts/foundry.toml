[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/contracts/",
]
